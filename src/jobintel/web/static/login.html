<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · JobIntel</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro">
      <div class="brand auth-brand">
        <div class="brand-mark" aria-hidden="true">JI</div>
        <div><strong>JobIntel</strong><span>求职情报工作台</span></div>
      </div>
      <p class="eyebrow">职位发现 · 匹配分析 · 求职跟踪</p>
      <h1>登录后，继续你的求职工作流。</h1>
      <p>候选人档案、搜索记录、分析结果和沟通草稿均需要通过账户验证后访问。</p>
    </section>

    <section class="auth-card" aria-live="polite">
      <div id="auth-loading" class="auth-loading">正在检查账户状态…</div>
      <form id="auth-form" hidden>
        <p class="eyebrow" id="auth-eyebrow">账户登录</p>
        <h2 id="auth-title">登录 JobIntel</h2>
        <p class="auth-copy" id="auth-copy">请输入你的账户信息。</p>
        <label id="display-name-field" class="registration-only" hidden>姓名<input name="display_name" minlength="1" maxlength="80" autocomplete="name"></label>
        <label id="email-field" class="registration-only" hidden>邮箱<input name="email" type="email" maxlength="320" autocomplete="email"></label>
        <label>用户名<input name="username" minlength="3" maxlength="50" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required></label>
        <label id="confirm-password-field" class="new-account-only" hidden>确认密码<input name="confirm_password" type="password" minlength="10" maxlength="128" autocomplete="new-password"></label>
        <p class="auth-error" id="auth-error" role="alert"></p>
        <button class="button primary full" id="auth-submit" type="submit">登录</button>
        <button class="auth-switch" id="auth-switch" type="button">没有账号？注册</button>
      </form>
    </section>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
