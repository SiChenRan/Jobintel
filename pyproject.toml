[project]
name = "jobintel"
version = "1.0.0"
description = "A local-first job discovery and fit-analysis agent for Chinese job seekers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["jobs", "job-search", "agent", "boss-zhipin", "mcp", "deepseek"]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "fastmcp>=2.0",
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "websocket-client>=1.8,<2",
    "pypdf>=6.16,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
jobintel = "jobintel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobintel"]

[tool.hatch.build.targets.wheel.force-include]
"data/jobintel_seed" = "jobintel/data/jobintel_seed"

[tool.hatch.build.targets.sdist]
include = [
    "/src/jobintel/**/*",
    "/data/jobintel_seed/*.json",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "RUF",
]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN401", # allow typing.Any where deliberately used
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"tests/**/*.py" = ["D", "ANN"]
# Typer relies on function-call defaults (Option/Argument); this is idiomatic.
"src/jobintel/cli.py" = ["B008"]
"src/jobintel/web/app.py" = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["jobintel"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["src/jobintel"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
